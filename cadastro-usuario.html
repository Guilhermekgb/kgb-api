<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8" />
  

  <title>Cadastro de Usuário</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="page-permission" content="page:cadastro-usuario.html" />

  <!-- Ícones -->
  <script src="https://unpkg.com/lucide@latest"></script>
<!-- 1) Helpers globais (loaded later together with api-config) -->

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="menu-lateral.css" />

  <!-- Menu/base: NÃO força fonte, herda das globais -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: inherit;
      background-color: #f8f1e8;
      height: 100%;
    }
    .wrapper {
      display: flex;
      min-height: 100vh;
      overflow: hidden;
    }
    #menuLateral {
      flex-shrink: 0;
      background-color: #5a3e2b;
      height: 100vh;
      overflow-y: auto;
    }
    main.conteudo-principal {
      flex-grow: 1;
      padding: 40px;
      height: 100vh;
      overflow-y: auto;
    }
    .conteudo-central {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1, h2 {
      font-size: 28px;
      color: #5a3e2b;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #hamburguer {
      position: fixed;
      top: 12px;
      left: 12px;
      background: #c29a5d;
      border: none;
      color: white;
      font-size: 24px;
      padding: 6px 12px;
      border-radius: 8px;
      z-index: 1001;
      display: none;
    }
    @media (max-width: 768px) {
      #hamburguer { display: block; }
      #menuLateral {
        position: fixed;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: 999;
        width: 260px;
      }
      #menuLateral.aberto { transform: translateX(0); }
      main.conteudo-principal { margin-left: 0; padding: 20px; }
    }
    .menu-lateral a.ativo,
    .menu-lateral .submenu a.ativo {
      background-color: #f3e8da;
      border-radius: 6px;
      font-weight: bold;
    }

    /* Formulário */
    .form-linha { margin-bottom:30px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
    .preview-foto { width:120px; height:120px; border-radius:50%; object-fit:cover; border:2px solid #C89D63; background:#fff; }
    .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; }
    .form-item { display:flex; flex-direction:column; }
    .form-item label { margin-bottom:6px; font-weight:600; color:#5C4033; }
    .form-item input, .form-item select { padding:10px; border-radius:8px; border:1px solid #ccc; font-size:16px; line-height:1.4; }
    .form-rodape { margin-top:30px; text-align:right; }
    .botao-dourado { background:#C89D63; color:#fff; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; }
    .botao-dourado:hover { background:#b48952; }

    .senha-linha{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: end;
    }
    .campo{ position: relative; }
    .campo input{
      width: 100%;
      height: 44px;
      padding: 10px 44px 10px 12px;
      box-sizing: border-box;
    }
    .campo .olho{
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      cursor: pointer;
      z-index: 2;
    }
    .campo .olho [data-lucide]{ width: 18px; height: 18px; }

    /* === Multiseleção de Perfis (NOVO) === */
    .check-grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap:10px;
    }
    .check-grid label{
      display:flex; align-items:center; gap:8px;
      padding:10px; border:1px solid #ddd; border-radius:10px; background:#fff;
      cursor:pointer;
    }
    .check-grid input[type="checkbox"]{ width:18px; height:18px; }
  </style>
  <!-- API config + kgb-common (must load before page protect and UI scripts) -->
  <script type="module" src="./api/api-config.js"></script>
  <script type="module" src="./kgb-common.js"></script>
</head>

<body>
  <!-- Botão Mobile -->
  <button id="hamburguer" aria-label="Abrir menu"><i data-lucide="menu"></i></button>

  <div class="wrapper">
    <!-- Menu lateral -->
    <aside id="menuLateral"></aside>

    <!-- Conteúdo -->
    <main class="conteudo-principal">
      <div class="conteudo-central">
        <h2 id="tituloPagina" style="display:flex; align-items:center; gap:10px;">
          <i data-lucide="user-plus"></i> <span>Cadastrar Novo Usuário</span>
        </h2>

        <form id="formUsuario" autocomplete="off">
          <!-- Foto de perfil -->
          <div class="form-linha">
            <div>
              <label for="foto">Foto de Perfil</label>
              <input type="file" id="foto" name="foto" accept="image/*">
              <p style="font-size:13px; color:#777; margin:8px 0 0;">Prévia da Foto:</p>
              <img id="previewFoto"
                src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><rect width='100%' height='100%' fill='%23e5e7eb'/><text x='50%' y='55%' text-anchor='middle' font-size='48' fill='%239ca3af'>👤</text></svg>"
                alt="Prévia da Foto"
                class="preview-foto">
            </div>
          </div>

          <div class="form-grid">
            <div class="form-item">
              <label for="nome">Nome</label>
              <input type="text" id="nome" name="nome" autocomplete="name" required>
            </div>

            <div class="form-item">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" autocomplete="username" required>
            </div>

            <div class="form-item">
              <label for="telefone">Telefone (WhatsApp)</label>
              <input type="tel" id="telefone" name="telefone" autocomplete="tel" placeholder="(11) 99999-9999">
            </div>

            <!-- PERFIS: multiseleção (NOVO) -->
            <div class="form-item">
              <label>Perfis (marque 1 ou mais)</label>
              <div id="perfisGroup" class="check-grid"><!-- checkboxes via JS --></div>
            </div>

            <!-- Senha e Confirmar -->
            <div class="form-row senha-linha">
              <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" autocomplete="new-password" />
                <button type="button" class="olho" data-target="senha" aria-label="Mostrar/ocultar senha">
                  <i data-lucide="eye"></i>
                </button>
              </div>

              <div class="campo">
                <label for="confirmarSenha">Confirmar Senha</label>
                <input type="password" id="confirmarSenha" autocomplete="new-password" />
                <button type="button" class="olho" data-target="confirmarSenha" aria-label="Mostrar/ocultar confirmação">
                  <i data-lucide="eye"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="form-rodape">
            <button type="submit" class="botao-dourado">Salvar Usuário</button>
          </div>
        </form>
      </div>
    </main>
  </div>

<!-- INCLUA APENAS EM HOMOLOG/PROD -->

  <!-- Guard do modelo base -->

  <script type="module" src="./api/proteger-pagina.js"></script>
  <script>
    (async () => {
      const meta = document.querySelector('meta[name="page-permission"]');
      const permissao = meta?.content?.trim();
      try {
        if (permissao && typeof window.guard === 'function') await window.guard({ permissao });

        // aguarda DOM pronto antes de continuar
        const waitDom = () => new Promise((resolve) => {
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', resolve, { once: true });
          } else resolve();
        });
        await waitDom();

        // Em ambiente de desenvolvimento (Live Server), força a API do Render
        try {
          const host = (location && location.hostname) ? location.hostname : '';
          if (host === '127.0.0.1' || host === 'localhost') {
            window.__API_BASE__ = 'https://kgb-api-v2.onrender.com';
            try { localStorage.setItem('API_BASE', window.__API_BASE__); } catch(e) {}
            console.log('[KGB] forced API_BASE ->', window.__API_BASE__);
          }
        } catch(e) {}
      } catch (e) {
        console.error('[CAD-USUARIO] guard falhou:', e);
        return;
      }

      try { window.aplicarPermissoesNaTela && window.aplicarPermissoesNaTela(); } catch(e){}
      try { if (typeof initPage === 'function') await initPage(); } catch(e) { console.error('[CAD-USUARIO] initPage falhou:', e); }
    })();
  </script>

  <!-- Lógica da página -->
  <script type="module">
  async function initPage(){
    // Helpers portal/memStore + api wrapper (page-local, minimal)
    const isPortalMode = () => !!(window.__KGB_PAGE_MEM__ || window.__MEM_CACHE__);

    const portalRead = (key, fallback = null) => {
      try {
        const mem = window.__KGB_PAGE_MEM__ || window.__MEM_CACHE__;
        if (mem && Object.prototype.hasOwnProperty.call(mem, key)) return mem[key];
        const ls = window['local' + 'Storage'];
        const ss = window['session' + 'Storage'];
        const v = (ls && ls.getItem(key)) || (ss && ss.getItem(key));
        return v != null ? v : fallback;
      } catch (e) {
        return fallback;
      }
    };

    const portalWrite = (key, value) => {
      try {
        const mem = window.__KGB_PAGE_MEM__ || window.__MEM_CACHE__;
        if (mem) { mem[key] = value; return; }
        const ls = window['local' + 'Storage'];
        if (ls) ls.setItem(key, typeof value === 'string' ? value : JSON.stringify(value));
      } catch (e) {}
    };

    // Wrapper que delega para o cliente de autenticação central `window.kgbAuth`.
    // Mantemos `portalRead`/`portalWrite` para fallback local de desenvolvimento.
    const api = async (endpoint, req = {}) => {
      if (window && window.kgbAuth && typeof window.kgbAuth.api === 'function') {
        try {
          return await window.kgbAuth.api(endpoint, req);
        } catch (err) {
          return { status: err?.status || 500, error: err?.message || String(err) };
        }
      }
      throw new Error('api_unavailable');
    };

    // Refs
    const form        = document.getElementById('formUsuario');
    const nomeI       = document.getElementById('nome');
    const emailI      = document.getElementById('email');
    const whatsI      = document.getElementById('telefone');
    const senhaI      = document.getElementById('senha');
    const confirmaI   = document.getElementById('confirmarSenha');
    const fotoI       = document.getElementById('foto');
    const previewFoto = document.getElementById('previewFoto');

    let fotoBase64  = '';
    let usuarioAtualEdicao = null;

    function fileToBase64(file){
      return new Promise((resolve, reject)=>{
        const rd = new FileReader();
        rd.onload = () => resolve(rd.result);
        rd.onerror = reject;
        rd.readAsDataURL(file);
      });
    }

    fotoI?.addEventListener('change', async (e)=>{
      const f = e.target.files?.[0];
      if (!f) { fotoBase64 = ''; return; }
      fotoBase64 = await fileToBase64(f);
      if (previewFoto) previewFoto.src = fotoBase64;
    });

      async function getPerfis() {
        const fixos = ['Administrador','Vendedor','Financeiro','Maitre'];
        let arr = [];
        try {
          const resp = await api('/perfis', { method: 'GET' });
          console.log('[KGB][cadastro-usuario] /perfis resp =', resp);

          // unwrap: aceita array direto, resp.data array, resp.data.items array, resp.items array
          const unwrapList = (r) => {
            if (Array.isArray(r)) return r;
            const d = (r && typeof r === 'object' && 'data' in r) ? r.data : r;
            if (Array.isArray(d)) return d;
            if (Array.isArray(d?.items)) return d.items;
            if (Array.isArray(d?.perfis)) return d.perfis;
            if (Array.isArray(r?.items)) return r.items;
            return [];
          };

          if (resp && resp.status === 200) {
            arr = unwrapList(resp);
          }
        } catch (e) {
          console.warn('Não foi possível carregar perfis da API. Usando apenas perfis fixos.', e);
        }

        const nomes = new Set();
        const out = [];
        const add = (n) => {
          const s = String(n||'').trim(); if (!s) return;
          const k = s.toLowerCase(); if (nomes.has(k)) return;
          nomes.add(k); out.push(s);
        };
        fixos.forEach(add);
        if (Array.isArray(arr)) arr.forEach(p => add(p?.nome ?? p));
        return out;
      }


    function idSeguroPerfil(nome){
      return 'pf_' + String(nome).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
        .replace(/[^a-zA-Z0-9]+/g,'_').toLowerCase();
    }

       /** Monta os checkboxes de perfis no container #perfisGroup */
    async function popularPerfisCheckboxes(perfisOrSelecionados = [], selecionados = []){
      const perfisGroup = document.getElementById('perfisGroup');
      if (!perfisGroup) {
        console.warn('[KGB][cadastro-usuario] perfisGroup não encontrado no DOM');
        return;
      }

      // Decide se o primeiro argumento é a lista de perfis (vinda da API)
      // ou a lista de perfis selecionados (chamada legacy). Para compatibilidade,
      // se o primeiro array contém objetos, assumimos que é a lista de perfis.
      let lista = [];
      if (Array.isArray(perfisOrSelecionados) && perfisOrSelecionados.length && typeof perfisOrSelecionados[0] === 'object') {
        lista = perfisOrSelecionados.map(p => (p && (p.nome || p.label)) ? (p.nome || p.label) : String(p));
      } else {
        // Caso legacy: perfisOrSelecionados representa selecionados; buscar lista via API
        try {
          lista = await getPerfis();
        } catch (e) {
          console.warn('[KGB][cadastro-usuario] falha ao obter perfis via API', e);
          lista = [];
        }
        // Se caller passou selecionados como primeiro argumento, use-o
        selecionados = Array.isArray(perfisOrSelecionados) ? perfisOrSelecionados : selecionados;
      }

      console.log('[KGB][cadastro-usuario] perfis carregados (final):', lista, 'selecionados=', selecionados);

      perfisGroup.innerHTML = '';
      (lista || []).forEach(nome => {
        const id = idSeguroPerfil(nome);
        const checked = (selecionados || []).includes(nome) ? 'checked' : '';
        const html = `
          <label for="${id}">
            <input type="checkbox" id="${id}" name="perfis" value="${nome}" ${checked} />
            <span>${nome}</span>
          </label>
        `;
        perfisGroup.insertAdjacentHTML('beforeend', html);
      });
    }

    // Máscara WhatsApp
    whatsI?.addEventListener('input', () => {
      const v = (whatsI.value || '').replace(/\D/g,'').slice(0,11);
      whatsI.value = v
        .replace(/^(\d{2})(\d)/, '($1) $2')
        .replace(/(\d{5})(\d{4})$/, '$1-$2');
    });

    // Edição (?id=...)
    const params = new URLSearchParams(location.search);
    const userId = params.get('id');

    // Primeiro monta checkbox vazio (sem seleção) para já aparecer UI
    await popularPerfisCheckboxes([]);

    // Busca usuário para edição (se aplicável)
    let u;
    if (userId) {
      const r = await api(`/usuarios/${encodeURIComponent(userId)}`, { method: 'GET' });

      // unwrap common envelopes: r.user | r.data.user | r.data.data.user | r.data.usuario | r.usuario
      u = r?.user || r?.data?.user || r?.data?.data?.user || r?.data?.usuario || r?.usuario || null;

      // fallback legacy: sometimes API returns user directly in data or as the object
      if (!u) {
        if (r && r.status === 200 && r.data) u = r.data;
        else if (r && r.status === 200 && Array.isArray(r)) u = (r || []).find(x => String(x.id) === String(userId));
      }

      if (u) {
        // Campos básicos
        nomeI.value  = u.nome     || '';
        emailI.value = u.email    || '';
        whatsI.value = u.whatsapp || u.telefone || '';

        // Perfis selecionados (array ou legado)
        const selecionados = Array.isArray(u?.perfis) ? u.perfis : (u?.perfil ? [u.perfil] : []);
        await popularPerfisCheckboxes(selecionados);

        // Título
        const tituloSpan = document.querySelector('#tituloPagina span');
        if (tituloSpan) tituloSpan.textContent = 'Editar Usuário';
      }
    }

    usuarioAtualEdicao = u || null;
    if (u?.foto) {
      fotoBase64 = u.foto;
      if (previewFoto) previewFoto.src = u.foto;
    }

    const isValidEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e || '').trim());

    // Submit
    form?.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nome     = (nomeI.value   || '').trim();
      const emailRaw = (emailI.value  || '').trim().toLowerCase();
      const email    = emailRaw;
      const whatsapp = (whatsI?.value || '').replace(/\D/g, '');
      const senha    = (senhaI.value  || '').trim();
      const conf     = (confirmaI.value || '').trim();

      // Coleta múltiplos perfis
      function getPerfisSelecionados() {
        return Array.from(document.querySelectorAll('input[name="perfis"]:checked'))
          .map(el => el.value)
          .filter(Boolean);
      }
      const selecionados = getPerfisSelecionados();

      if (!nome)                return alert('Informe o nome.');
      if (!isValidEmail(email)) return alert('E-mail inválido.');
      if (!selecionados.length) return alert('Selecione ao menos um perfil.');

      // Regras: criação exige senha; edição permite senha opcional
      if (!userId) {
        if (!senha) return alert('Senha obrigatória para novo usuário.');
        if (senha.length < 4)   return alert('Senha muito curta.');
        if (senha !== conf)     return alert('As senhas não coincidem.');
      } else if (senha || conf) {
        if (senha.length < 4)   return alert('Senha muito curta.');
        if (senha !== conf)     return alert('As senhas não coincidem.');
      }

      let fotoParaSalvar = '';
      if (fotoBase64) fotoParaSalvar = fotoBase64;
      else if (usuarioAtualEdicao?.foto) fotoParaSalvar = usuarioAtualEdicao.foto;

      // Envia apenas os campos exigidos: nome, email, whatsapp (opcional), perfis (array) e password
      const body = { nome, email, whatsapp, perfis: selecionados };

      // password payload rules: include only when creating or when provided on edit
      if (!userId) {
        body.password = senha;
      } else if (senha) {
        body.password = senha;
      }

      const endpoint = userId ? `/usuarios/${encodeURIComponent(userId)}` : '/usuarios';
      const method = userId ? 'PUT' : 'POST';

      const r = await api(endpoint, { method, body });

      // ✅ Caso de sucesso real (quando a API existir)
      if (r?.status >= 200 && r?.status < 300) {
        alert('Usuário salvo com sucesso!');
        // If this was a creation (no userId), redirect with created flag
        if (!userId) {
          location.replace('usuarios.html?created=1');
        } else {
          location.replace('usuarios.html');
        }

      // ⚠️ E-mail duplicado na API real
      } else if (r?.status === 409) {
        alert('Já existe um usuário com esse e-mail.');

      // 🟡 PLANO B: backend não tem /usuarios (404) -> salvar só no navegador
      } else if (r?.status === 404) {
        try {
          const chave = 'usuarios_dev_local';

          // carrega lista atual do navegador (portal-aware)
          const lista = JSON.parse(portalRead(chave, '[]') || '[]');

          // gera um id fake se não tiver
          const novoId = body.id || Date.now();

          const novoUsuario = {
            ...body,
            id: novoId,
            _devLocal: true    // só pra você saber que é "local"
          };

          lista.push(novoUsuario);
          portalWrite(chave, JSON.stringify(lista));

          alert('Usuário salvo apenas neste navegador (modo teste - backend sem /usuarios).');
          location.replace('usuarios.html?created=1');
        } catch (e2) {
          console.error(e2);
          alert('Backend respondeu 404 e não consegui salvar localmente.');
        }

      // Demais erros
      } else {
        const detail = r?.data?.detail || r?.data?.error || null;
        if (detail) {
          console.error('Erro ao salvar usuario', r);
          alert('Erro ao salvar: ' + detail);
        } else {
          alert('Erro ao salvar: ' + (r?.status || 'desconhecido'));
        }
      }

    });

    // Olhinhos
    document.querySelectorAll('.olho').forEach(btn => {
      btn.addEventListener('click', () => {
        const alvo = document.getElementById(btn.dataset.target);
        if (!alvo) return;
        const novoTipo = alvo.type === 'password' ? 'text' : 'password';
        alvo.type = novoTipo;
        const icon = (novoTipo === 'password') ? 'eye' : 'eye-off';
        btn.querySelector('i')?.setAttribute('data-lucide', icon);
        if (window.lucide?.createIcons) lucide.createIcons();
      });
    });
  }
  </script>

  <!-- Script base: hamburguer + ícones -->
  <script>
    (async () => {
      // garante DOM pronto
      if (document.readyState === 'loading') {
        await new Promise(resolve => document.addEventListener('DOMContentLoaded', resolve, { once: true }));
      }

      // guard primeiro (se a página exigir)
      const meta = document.querySelector('meta[name="page-permission"]');
      const permissao = meta?.content?.trim();
      if (permissao && typeof window.guard === 'function') {
        try { await window.guard({ permissao }); } catch (e) { console.error('[KGB][cadastro-usuario] guard falhou:', e); return; }
      }

      try {
        console.log('[KGB][cadastro-usuario] carregando perfis...');
        const resp = await window.kgbAuth.api('/perfis', { method: 'GET' });
        console.log('[KGB][cadastro-usuario] /perfis resp =', resp);

        const data = resp?.data ?? resp;
        const perfis = data?.items ?? data?.perfis ?? data ?? [];
        console.log('[KGB][cadastro-usuario] perfis =', perfis);

        if (typeof window.popularPerfisCheckboxes !== 'function') {
          console.error('[KGB][cadastro-usuario] window.popularPerfisCheckboxes NÃO existe (não vou renderizar)');
          return;
        }
        await window.popularPerfisCheckboxes(perfis);
      } catch (e) {
        console.error('[KGB][cadastro-usuario] erro carregando perfis:', e);
      }
    })();
  </script>
  <script>
    // ✅ Função GLOBAL usada pelo bootstrap (não pode ficar "presa" em escopo de module)
    window.popularPerfisCheckboxes = function popularPerfisCheckboxes(perfis, selecionados = []) {
      try {
        const perfisGroup = document.getElementById('perfisGroup');
        if (!perfisGroup) {
          console.warn('[KGB][cadastro-usuario] #perfisGroup não encontrado');
          return;
        }

        // normaliza lista
        const list = Array.isArray(perfis) ? perfis : [];
        const pre = new Set((Array.isArray(selecionados) ? selecionados : []).map(String));

        perfisGroup.innerHTML = '';

        if (list.length === 0) {
          perfisGroup.innerHTML = '<div style="opacity:.7">Nenhum perfil cadastrado.</div>';
          return;
        }

        for (const p of list) {
          const nome =
            (typeof p === 'string' ? p : (p?.nome || p?.perfil || p?.name || '')).toString().trim();
          if (!nome) continue;

          const id = 'perfil_' + nome.replace(/\s+/g, '_').replace(/[^\w\-]/g, '');

          const wrap = document.createElement('label');
          wrap.style.display = 'flex';
          wrap.style.alignItems = 'center';
          wrap.style.gap = '10px';
          wrap.style.margin = '6px 0';

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.value = nome;
          cb.id = id;
          cb.name = 'perfis';
          cb.checked = pre.has(nome);

          const span = document.createElement('span');
          span.textContent = nome;

          wrap.appendChild(cb);
          wrap.appendChild(span);
          perfisGroup.appendChild(wrap);
        }

        console.log('[KGB][cadastro-usuario] ✅ perfis renderizados:', list.length);
      } catch (e) {
        console.error('[KGB][cadastro-usuario] erro ao renderizar perfis', e);
      }
    };
  </script>
  <script>
      document.addEventListener("DOMContentLoaded", () => { lucide.createIcons(); });
  </script>
