<!DOCTYPE html>
<html lang="pt-BR">
<head>
  
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="page-permission" content="page:login.html">
  

  <title>Login - Sistema Buffet</title>

  <script>
    // Import helper para padronizar API_BASE (exposto em window.__getApiBase)
    (function(){
      try {
        var s=document.createElement('script'); s.src='js/auth-helper.js'; document.head.appendChild(s);
      } catch(e){}
    })();
    /* Impede bloqueio no login */
    window.__KGB_GUARD_BYPASS__ = true;
  </script>

  <style>
    :root {
      --marrom: #4a2c18;
      --dourado: #f8d57e;
      --dourado-hover: #e0bc66;
      --branco: #ffffff;
      --sombra: rgba(0, 0, 0, 0.1);
      --fonte: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    }

    body {
      background-color: #fdf6ee;
      font-family: var(--fonte);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background-color: var(--branco);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 30px var(--sombra);
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    .login-box img {
      width: 140px;
      margin-bottom: 20px;
    }

    .login-box h2 {
      margin-bottom: 24px;
      color: var(--marrom);
      font-weight: bold;
    }

    .campo {
      text-align: left;
      margin-bottom: 14px;
    }

    .campo label {
      display: block;
      font-size: 12px;
      color: #705542;
      margin: 0 0 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--dourado);
      color: var(--marrom);
      font-weight: bold;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 6px;
    }

    button:hover {
      background-color: var(--dourado-hover);
    }

    .link-esqueci {
      margin-top: 8px;
      text-align: right;
      font-size: 13px;
    }

    .link-esqueci a {
      color: #a16b1f;
      text-decoration: none;
    }

    .link-esqueci a:hover {
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <script>
    // DEBUG + SAFETY: bloquear redirects no login até sucesso explícito
    window.__ALLOW_REDIRECT__ = false;

    (function(){
      const _replace = window.location.replace.bind(window.location);
      const _assign  = window.location.assign.bind(window.location);

      function blocked(target, fnName){
        const t = String(target || '');
        const isDash = t.includes('dashboard.html') || t.endsWith('/dashboard') || t.endsWith('/dashboard.html');
        if (isDash && !window.__ALLOW_REDIRECT__) {
          console.warn('[LOGIN][BLOCK] Tentativa de redirect bloqueada ->', t, 'via', fnName);
          console.trace('[LOGIN][BLOCK] stack trace');
          return; // bloqueia
        }
        return fnName === 'replace' ? _replace(target) : _assign(target);
      }

      window.location.replace = (u) => blocked(u, 'replace');
      window.location.assign  = (u) => blocked(u, 'assign');

      // também bloqueia navegação via link/button com href dashboard
      document.addEventListener('click', (e) => {
        const a = e.target.closest && e.target.closest('a[href]');
        if (!a) return;
        const href = a.getAttribute('href') || '';
        if ((href.includes('dashboard.html') || href.endsWith('dashboard.html')) && !window.__ALLOW_REDIRECT__) {
          e.preventDefault();
          console.warn('[LOGIN][BLOCK] clique em link para dashboard bloqueado:', href);
          console.trace('[LOGIN][BLOCK] click stack');
        }
      }, true);
    })();
  </script>
  <div class="login-box">
    <img src="logo.png" alt="Logo KGB" />
    <h2>Entrar no Sistema</h2>

    <form id="formLogin" autocomplete="on" novalidate>
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seu@email.com" required />
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" type="password" placeholder="Sua senha" required />
      </div>

      <button type="submit">Entrar</button>

      <div class="link-esqueci">
        <span style="font-size:13px; color:#705542;">Esqueceu a senha? Procure o administrador para redefinir.</span>
      </div>
    </form>
    <div id="login-erro" style="color:#a12; margin-top:12px; display:none"></div>
  </div>

  <script type="module" src="./api/api-config.js"></script>
  <script type="module" src="./kgb-common.js"></script>

  <script>
  // LOGIN: hard reset e handler fail-closed
  (function () {
    // FORCE LOGOUT ON LOGIN PAGE (para evitar token antigo “mascarando” erro)
    try {
      localStorage.removeItem('KGB_AUTH_TOKEN');
      sessionStorage.removeItem('KGB_AUTH_TOKEN');
    } catch(e){}

    // garantir fallback de API_BASE para uso no snippet abaixo
    try { window.__API_BASE__ = (window.__API_BASE__ || window.API_BASE || '').replace(/\/+$/,''); } catch(e) { window.__API_BASE__ = (window.__API_BASE__ || ''); }

    const form = document.getElementById("formLogin");
    const emailInput = document.getElementById("email");
    const senhaInput = document.getElementById("senha");
    const erroEl = document.getElementById('login-erro');

    function setError(msg){ try { if(!erroEl) return; erroEl.style.display = msg ? 'block' : 'none'; erroEl.textContent = msg || ''; } catch(e){} }
    function setLoading(v){ try { const btn = document.querySelector('button[type="submit"], #btnEntrar, .btn-entrar'); if(btn) btn.disabled = !!v; } catch(e){} }

    async function safeReadError(resp) {
      try {
        const ct = resp.headers.get('content-type') || '';
        if (ct.includes('application/json')) {
          const j = await resp.json();
          return j?.message || j?.error || '';
        }
        return (await resp.text())?.slice(0, 200);
      } catch { return ''; }
    }

    if (!form || !emailInput || !senhaInput) return;

    form.removeAttribute('action');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // HARD RESET sempre
      try {
        localStorage.removeItem('KGB_AUTH_TOKEN');
        sessionStorage.removeItem('KGB_AUTH_TOKEN');
      } catch(e){}

      console.log('[LOGIN] submit start');

      setError('');
      setLoading(true);

      try {
        const email = emailInput.value.trim();
        const senha = senhaInput.value;

        const url = `${window.__API_BASE__}/auth/login`;
        console.log('[LOGIN] POST', url);

        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'omit',
          body: JSON.stringify({ email, senha })
        });

        console.log('[LOGIN] status', resp.status);
        try {
          const raw = await resp.clone().text().catch(() => '');
          console.log('[LOGIN][DIAG] raw body', String(raw || '').slice(0, 500));
        } catch (e) { console.warn('[LOGIN][DIAG] failed reading body', e); }

        if (!resp.ok) {
          // NUNCA REDIRECIONAR EM FALHA
          const msg = await safeReadError(resp);
          console.warn('[LOGIN] FAIL - no redirect', resp.status, msg);
          try {
            localStorage.removeItem('KGB_AUTH_TOKEN');
            sessionStorage.removeItem('KGB_AUTH_TOKEN');
          } catch(e){}
          setError(msg || 'E-mail ou senha inválidos.');
          return; // HARD STOP
        }

        const data = await resp.json().catch(() => ({}));
        const token = data?.token;

        if (!token) {
          console.warn('[LOGIN] OK sem token - bloqueando');
          setError('Login não retornou token. Verifique /auth/login.');
          return;
        }

        // Salva token(s) padronizados para outras páginas lerem
        try {
          localStorage.setItem('KGB_AUTH_TOKEN', token);
          localStorage.setItem('KGB_TOKEN', token);
        } catch (e) {}
        console.log('[LOGIN] token salvo len=', token.length);

        // Se backend indicar troca obrigatória de senha, redireciona para trocar-senha.html
        if (data && data.mustChangePassword === true) {
          try { localStorage.setItem('KGB_MUST_CHANGE_PASSWORD', '1'); } catch(e){}
          window.location.href = 'trocar-senha.html';
          return;
        } else {
          try { localStorage.removeItem('KGB_MUST_CHANGE_PASSWORD'); } catch(e){}
        }

        // valida sessão com Bearer e segue fluxo normal
        await apiFetch('/auth/me');
        console.log('[LOGIN] /auth/me OK -> redirect');

        const params = new URLSearchParams(location.search);
        const returnUrl = params.get('returnUrl') || 'dashboard.html';
        // permitir redirect somente em sucesso explícito
        try { window.__ALLOW_REDIRECT__ = true; } catch(e){}
        location.replace(returnUrl);

      } catch (err) {
        console.error('[LOGIN] exception', err);
        try {
          localStorage.removeItem('KGB_AUTH_TOKEN');
          sessionStorage.removeItem('KGB_AUTH_TOKEN');
        } catch(e){}
        setError('Falha ao conectar. Tente novamente.');
      } finally {
        setLoading(false);
      }
    });
  })();
  </script>
</body>
</html>
