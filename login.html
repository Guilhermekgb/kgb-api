<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="page-permission" content="page:login.html">
  <!-- === INÍCIO PATCH __API_BASE__ (auto) === -->
  <script>
    (function(){
      // Produção (Netlify) -> API na Render (usar mesma origem por padrão)
      var PROD_API = window.location.origin;

      // Em DEV, preferimos usar location.origin quando o backend roda em :3333
      var DEV_API = (location.port === '3333')
        ? location.origin
        : (window.__API_BASE__ || window.location.origin);

      // Exporta helper consistente para o restante do app
      window.__getApiBase = function () {
        if (location.port === '3333') return location.origin;
        return DEV_API;
      };

      // Mantemos também a variável legada para compatibilidade
      try { window.__API_BASE__ = window.__getApiBase(); } catch(e){}
      console.log('[KGB] __getApiBase ->', window.__API_BASE__);
    })();
  </script>
  <!-- === FIM PATCH __API_BASE__ (auto) === -->

  <title>Login - Sistema Buffet</title>

  <script>
    // Import helper para padronizar API_BASE (exposto em window.__getApiBase)
    (function(){
      try {
        var s=document.createElement('script'); s.src='js/auth-helper.js'; document.head.appendChild(s);
      } catch(e){}
    })();
    /* Impede bloqueio no login */
    window.__KGB_GUARD_BYPASS__ = true;
  </script>

  <style>
    :root {
      --marrom: #4a2c18;
      --dourado: #f8d57e;
      --dourado-hover: #e0bc66;
      --branco: #ffffff;
      --sombra: rgba(0, 0, 0, 0.1);
      --fonte: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    }

    body {
      background-color: #fdf6ee;
      font-family: var(--fonte);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background-color: var(--branco);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 30px var(--sombra);
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    .login-box img {
      width: 140px;
      margin-bottom: 20px;
    }

    .login-box h2 {
      margin-bottom: 24px;
      color: var(--marrom);
      font-weight: bold;
    }

    .campo {
      text-align: left;
      margin-bottom: 14px;
    }

    .campo label {
      display: block;
      font-size: 12px;
      color: #705542;
      margin: 0 0 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--dourado);
      color: var(--marrom);
      font-weight: bold;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 6px;
    }

    button:hover {
      background-color: var(--dourado-hover);
    }

    .link-esqueci {
      margin-top: 8px;
      text-align: right;
      font-size: 13px;
    }

    .link-esqueci a {
      color: #a16b1f;
      text-decoration: none;
    }

    .link-esqueci a:hover {
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="login-box">
    <img src="logo.png" alt="Logo KGB" />
    <h2>Entrar no Sistema</h2>

    <form id="formLogin" autocomplete="on" novalidate>
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seu@email.com" required />
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" type="password" placeholder="Sua senha" required />
      </div>

      <button type="submit">Entrar</button>

      <div class="link-esqueci">
        <a href="esqueci-senha.html">Esqueci minha senha</a>
      </div>
    </form>
    <div id="login-erro" style="color:#a12; margin-top:12px; display:none"></div>
  </div>

<script>
  // Login simples SOMENTE PARA USO NA SUA MÁQUINA (desenvolvimento)
  (function () {
    const form = document.getElementById("formLogin");
    const emailInput = document.getElementById("email");
    const senhaInput = document.getElementById("senha");

    if (!form || !emailInput || !senhaInput) return;

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const email = String(emailInput.value || "").trim().toLowerCase();
      const senha = String(senhaInput.value || "").trim();

      if (!email || !senha) {
        alert("Informe e-mail e senha.");
        return;
      }

      // Tenta autenticar no backend via /auth/login (cookie httpOnly)
      try {
        const base = (typeof window.__getApiBase === 'function') ? window.__getApiBase() : (window.__API_BASE__ || '');
        const isSameOrigin3333 = String(location.port || '') === '3333' || base === location.origin;
        const loginUrl = isSameOrigin3333 ? '/auth/login' : (base || '') + '/auth/login';

        const payload = { email, senha };
        const method = 'POST';
        const urlToCall = loginUrl;
          console.log('[LOGIN] will call', { method, url: '/auth/login', payload: { email, senha: '***' } });

        let j = null;
        try {
          // apiFetch throws on non-OK and returns parsed payload on success
          j = await window['apiFetch'](urlToCall, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          console.log('[LOGIN] call succeeded', { method, url: urlToCall, response: j });
        } catch (err) {
          const status = err && err.status;
          const payloadErr = err && err.payload;
          console.error('[LOGIN] failed', { method, url: urlToCall, status, response: payloadErr, message: err && err.message });
          // mostra resultado na tela para depuração
          let dbg = document.getElementById('login-debug');
          if (!dbg) {
            dbg = document.createElement('pre');
            dbg.id = 'login-debug';
            dbg.style.whiteSpace = 'pre-wrap';
            dbg.style.background = '#111';
            dbg.style.color = '#fff';
            dbg.style.padding = '8px';
            dbg.style.borderRadius = '6px';
            dbg.style.marginTop = '12px';
            form.appendChild(dbg);
          }
          dbg.textContent = JSON.stringify({ payload, status, response: payloadErr, message: err && err.message }, null, 2);
          // show friendly error to user
          try{
            let errEl = document.getElementById('login-erro');
            if (!errEl) { errEl = document.createElement('div'); errEl.id = 'login-erro'; form.appendChild(errEl); }
            errEl.style.display = 'block';
            errEl.textContent = `Falha no login (status ${status || 'unknown'}). Se estiver em deploy, aguarde o Render atualizar e tente novamente.`;
          }catch(e){}
          return;
        }

        // Normaliza resposta de login e aceita variações de campo
        try {
          const token = (j && (j.token || j.access_token || j.jwt)) || null;
          const user = (j && (j.user || j.data || null)) || null;
          if (!token) {
            console.error('[LOGIN] resposta sem token:', j);
            try{ let errEl = document.getElementById('login-erro'); if (!errEl) { errEl = document.createElement('div'); errEl.id = 'login-erro'; form.appendChild(errEl);} errEl.style.display='block'; errEl.textContent = 'Login falhou: API respondeu sem token.'; }catch(e){}
            alert(j?.message || j?.erro || 'Login falhou: API respondeu sem token.');
            return;
          }

          // salvar token usando helper do projeto quando existir, senão localStorage
          try {
            if (typeof window.setAuthToken === 'function') {
              window.setAuthToken(String(token));
            } else {
              try { localStorage.setItem('KGB_TOKEN', String(token)); } catch(e){}
            }
            // salvar usuário em cache padrão
            if (user) window.__KGB_USER_CACHE = user;
            console.log('[LOGIN] success', user || null);
            window.location.href = 'dashboard.html';
            return;
          } catch (e) {
            console.warn('[LOGIN] failed to store token/user', e);
          }
        } catch (e) {
          console.error('[LOGIN] erro ao processar resposta', e, j);
        }

        // Fallback dev: se o backend não responder, ainda aceitamos credenciais dev
      } catch (err) {
        console.warn('Autenticação via API falhou, tentando fallback dev', err);
      }

      // Fallback legacy (apenas para desenvolvimento local)
      const EMAIL_FIXO = "admin@buffet.com";
      const SENHA_FIXA = "123456";
      if (email === EMAIL_FIXO && senha === SENHA_FIXA) {
        try {
          // Fallback DEV: não persiste nada no storage do navegador — usa memStore apenas
          const tokenFake = 'dev-token-' + Date.now();
          window.__ui_login = window.__ui_login || new Map();
          window.__ui_login.set('auth.token', tokenFake);
          const perfisLista = ['Administrador'];
          window.__ui_login.set('auth.roles', perfisLista.join(','));
          window.__ui_login.set('perfil', perfisLista[0]);
          const sessao = { id: 'dev', nome: 'Admin Buffet', email: EMAIL_FIXO, perfil: perfisLista[0], perfis: perfisLista };
          window.__ui_login.set('auth:user', JSON.stringify(sessao));
        } catch (e) { console.error(e); alert('Erro ao salvar sessão no navegador.'); return; }
        window.location.href = 'dashboard.html';
        return;
      }

      alert('E-mail ou senha inválidos.');
    });
  })();
</script>


  <script type="module" src="./kgb-common.js"></script>
  <script type="module" src="./api/api-fetch.js" defer>
</body>
</html>
