<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="page-permission" content="page:login.html">
  <!-- === INÍCIO PATCH __API_BASE__ (auto) === -->
  <script>
    (function(){
      // Produção (Netlify) -> API na Render (usar mesma origem por padrão)
      var PROD_API = window.location.origin;

      // Em DEV, preferimos usar location.origin quando o backend roda em :3333
      var DEV_API = (location.port === '3333')
        ? location.origin
        : (window.__API_BASE__ || window.location.origin);

      // Exporta helper consistente para o restante do app
      window.__getApiBase = function () {
        if (location.port === '3333') return location.origin;
        return DEV_API;
      };

      // Mantemos também a variável legada para compatibilidade
      try { window.__API_BASE__ = window.__getApiBase(); } catch(e){}
      console.log('[KGB] __getApiBase ->', window.__API_BASE__);
    })();
  </script>
  <!-- === FIM PATCH __API_BASE__ (auto) === -->

  <title>Login - Sistema Buffet</title>

  <script>
    // Import helper para padronizar API_BASE (exposto em window.__getApiBase)
    (function(){
      try {
        var s=document.createElement('script'); s.src='js/auth-helper.js'; document.head.appendChild(s);
      } catch(e){}
    })();
    /* Impede bloqueio no login */
    window.__KGB_GUARD_BYPASS__ = true;
  </script>

  <style>
    :root {
      --marrom: #4a2c18;
      --dourado: #f8d57e;
      --dourado-hover: #e0bc66;
      --branco: #ffffff;
      --sombra: rgba(0, 0, 0, 0.1);
      --fonte: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    }

    body {
      background-color: #fdf6ee;
      font-family: var(--fonte);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background-color: var(--branco);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 30px var(--sombra);
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    .login-box img {
      width: 140px;
      margin-bottom: 20px;
    }

    .login-box h2 {
      margin-bottom: 24px;
      color: var(--marrom);
      font-weight: bold;
    }

    .campo {
      text-align: left;
      margin-bottom: 14px;
    }

    .campo label {
      display: block;
      font-size: 12px;
      color: #705542;
      margin: 0 0 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--dourado);
      color: var(--marrom);
      font-weight: bold;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 6px;
    }

    button:hover {
      background-color: var(--dourado-hover);
    }

    .link-esqueci {
      margin-top: 8px;
      text-align: right;
      font-size: 13px;
    }

    .link-esqueci a {
      color: #a16b1f;
      text-decoration: none;
    }

    .link-esqueci a:hover {
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="login-box">
    <img src="logo.png" alt="Logo KGB" />
    <h2>Entrar no Sistema</h2>

    <form id="formLogin" autocomplete="on" novalidate>
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seu@email.com" required />
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" type="password" placeholder="Sua senha" required />
      </div>

      <button type="submit">Entrar</button>

      <div class="link-esqueci">
        <a href="esqueci-senha.html">Esqueci minha senha</a>
      </div>
    </form>
    <div id="login-erro" style="color:#a12; margin-top:12px; display:none"></div>
  </div>

<script>
  // Login simples SOMENTE PARA USO NA SUA MÁQUINA (desenvolvimento)
  (function () {
    const form = document.getElementById("formLogin");
    const emailInput = document.getElementById("email");
    const senhaInput = document.getElementById("senha");

    if (!form || !emailInput || !senhaInput) return;

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const email = String(emailInput.value || "").trim().toLowerCase();
      const senha = String(senhaInput.value || "").trim();

      if (!email || !senha) {
        alert("Informe e-mail e senha.");
        return;
      }

      // Tenta autenticar no backend via /auth/login (cookie httpOnly)
      try {
        const base = (typeof window.__getApiBase === 'function') ? window.__getApiBase() : (window.__API_BASE__ || '');
        const isSameOrigin3333 = String(location.port || '') === '3333' || base === location.origin;
        const loginUrl = isSameOrigin3333 ? '/auth/login' : (base || '') + '/auth/login';

        // --- [KGB] auth login robusto ---
        const resp = await fetch(loginUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha }),
          credentials: 'include',
        });

        let j = null;
        try { j = await resp.json(); } catch(e) {}

        if (!resp.ok) {
          console.warn('[KGB][login] falhou', { status: resp.status, body: j });
          alert('E-mail ou senha inválidos.');
          return; // <<< CRÍTICO: não pode seguir para redirect
        }

        // --- [KGB] auth: token opcional (cookie httpOnly ou Bearer) ---
        const data = j;
        const token =
          (j && (j.token || j.access_token || j.jwt)) ||
          (data && (data.token || data.access_token || data.jwt)) ||
          null;

        try {
          const oldKeys = ['KGB_TOKEN','AUTH_TOKEN','ACCESS_TOKEN','access_token','token','jwt'];
          for (const k of oldKeys) {
            try { localStorage.removeItem(k); } catch(e) {}
            try { sessionStorage.removeItem(k); } catch(e) {}
          }
        } catch(e){}

        if (token) {
          try {
            localStorage.setItem('KGB_AUTH_TOKEN', String(token));
            window.KGB_AUTH_TOKEN = String(token);
            console.log('[KGB][login] token salvo em KGB_AUTH_TOKEN');
          } catch (e) {
            console.warn('[KGB][login] falha salvando token', e);
          }
        } else {
          console.log('[KGB][login] sem token no JSON (provável cookie httpOnly). Seguindo...');
        }

        // redirect com returnUrl
        try {
          const params = new URLSearchParams(location.search);
          const returnUrl = params.get('returnUrl');
          location.href = returnUrl ? decodeURIComponent(returnUrl) : './dashboard.html';
        } catch (e) {
          location.href = './dashboard.html';
        }

      } catch (err) {
        console.warn('Autenticação via API falhou', err);
      }

      alert('E-mail ou senha inválidos.');
    });
  })();
</script>


  <script type="module" src="./api/api-config.js"></script>
  <script type="module" src="./kgb-common.js"></script>
  <script type="module" src="./api/api-fetch.js" defer>
</body>
</html>
