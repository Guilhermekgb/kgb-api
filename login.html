<!DOCTYPE html>
<html lang="pt-BR">
<head>
  
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="page-permission" content="page:login.html">
  

  <title>Login - Sistema Buffet</title>

  <script>
    /* Impede bloqueio no login */
    window.__KGB_GUARD_BYPASS__ = true;
  </script>

  <style>
    :root {
      --marrom: #4a2c18;
      --dourado: #f8d57e;
      --dourado-hover: #e0bc66;
      --branco: #ffffff;
      --sombra: rgba(0, 0, 0, 0.1);
      --fonte: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    }

    body {
      background-color: #fdf6ee;
      font-family: var(--fonte);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background-color: var(--branco);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 30px var(--sombra);
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    .login-box img {
      width: 140px;
      margin-bottom: 20px;
    }

    .login-box h2 {
      margin-bottom: 24px;
      color: var(--marrom);
      font-weight: bold;
    }

    .campo {
      text-align: left;
      margin-bottom: 14px;
    }

    .campo label {
      display: block;
      font-size: 12px;
      color: #705542;
      margin: 0 0 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--dourado);
      color: var(--marrom);
      font-weight: bold;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 6px;
    }

    button:hover {
      background-color: var(--dourado-hover);
    }

    .link-esqueci {
      margin-top: 8px;
      text-align: right;
      font-size: 13px;
    }

    .link-esqueci a {
      color: #a16b1f;
      text-decoration: none;
    }

    .link-esqueci a:hover {
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <script>
    // DEBUG + SAFETY: bloquear redirects no login até sucesso explícito
    window.__ALLOW_REDIRECT__ = false;

    (function(){
      const _replace = window.location.replace.bind(window.location);
      const _assign  = window.location.assign.bind(window.location);

      function blocked(target, fnName){
        const t = String(target || '');
        const isDash = t.includes('dashboard.html') || t.endsWith('/dashboard') || t.endsWith('/dashboard.html');
        if (isDash && !window.__ALLOW_REDIRECT__) {
          console.warn('[LOGIN][BLOCK] Tentativa de redirect bloqueada ->', t, 'via', fnName);
          console.trace('[LOGIN][BLOCK] stack trace');
          return; // bloqueia
        }
        return fnName === 'replace' ? _replace(target) : _assign(target);
      }

      window.location.replace = (u) => blocked(u, 'replace');
      window.location.assign  = (u) => blocked(u, 'assign');

      // também bloqueia navegação via link/button com href dashboard
      document.addEventListener('click', (e) => {
        const a = e.target.closest && e.target.closest('a[href]');
        if (!a) return;
        const href = a.getAttribute('href') || '';
        if ((href.includes('dashboard.html') || href.endsWith('dashboard.html')) && !window.__ALLOW_REDIRECT__) {
          e.preventDefault();
          console.warn('[LOGIN][BLOCK] clique em link para dashboard bloqueado:', href);
          console.trace('[LOGIN][BLOCK] click stack');
        }
      }, true);
    })();
  </script>
  <div class="login-box">
    <img src="logo.png" alt="Logo KGB" />
    <h2>Entrar no Sistema</h2>

    <form id="formLogin" autocomplete="on" novalidate>
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seu@email.com" required />
      </div>

      <div class="campo">
        <label for="password">Senha</label>
        <input id="password" type="password" placeholder="Sua senha" required />
      </div>

      <button type="submit">Entrar</button>

      <div class="link-esqueci">
        <span style="font-size:13px; color:#705542;">Esqueceu a senha? Procure o administrador para redefinir.</span>
      </div>
    </form>
    <div id="login-erro" style="color:#a12; margin-top:12px; display:none"></div>
  </div>

  <script type="module" src="./api/api-config.js"></script>
  <script type="module" src="./kgb-common.js"></script>
  <script type="module" src="./api/auth-client.js"></script>

  <script type="module">
  // LOGIN (module): diagnóstico visível + fail-safe
  (function () {
    const form = document.getElementById("formLogin");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const erroEl = document.getElementById("login-erro");
    const btn = form ? form.querySelector('button[type="submit"]') : null;

    function setError(msg){
      try{
        if (erroEl){
          erroEl.style.display = msg ? 'block' : 'none';
          erroEl.textContent = msg || '';
        } else {
          alert(msg);
        }
      }catch(e){
        console.warn('[LOGIN] setError failed', e);
        alert(msg);
      }
    }

    function setLoading(on){
      try{
        if (btn){
          btn.disabled = !!on;
          btn.textContent = on ? 'Entrando...' : 'Entrar';
        }
      }catch(e){}
    }

    // Diagnóstico básico já ao carregar
    try {
      const apiBase = window.__API_BASE__ || window.__KGB_API_BASE__ || '';
      console.log('[LOGIN][DIAG] __API_BASE__ =', apiBase);
      console.log('[LOGIN][DIAG] typeof window.apiFetch =', typeof window.apiFetch);
      console.log('[LOGIN][DIAG] typeof window.kgbAuth =', typeof window.kgbAuth);

      if (!form) setError('ERRO: formLogin não encontrado (DOM).');
      if (typeof window.kgbAuth !== 'object') setError('ERRO: kgbAuth não carregou. Verifique include do ./api/auth-client.js');
      if (typeof window.apiFetch !== 'function') setError('ERRO: apiFetch não carregou. Verifique includes api-config.js + kgb-common.js (ordem).');
      if (!apiBase) console.warn('[LOGIN][DIAG] API base vazia — api-config/kgb-common podem não ter resolvido ainda.');
    } catch(e) {
      console.warn('[LOGIN][DIAG] exception', e);
    }

    if (!form) return;

    // Hard reset de token antigo
    try { localStorage.removeItem('KGB_AUTH_TOKEN'); sessionStorage.removeItem('KGB_AUTH_TOKEN'); } catch(e){}
    try { localStorage.removeItem('KGB_TOKEN'); sessionStorage.removeItem('KGB_TOKEN'); } catch(e){}

    // helper alias expected by caller code
    function mostrarErro(msg){ setError(msg); }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (form.dataset.submitting === '1') return;
      form.dataset.submitting = '1';
      console.log('[LOGIN] submit fired');

      setError('');
      setLoading(true);

      try {
        const email = (emailInput?.value || '').trim();
        const password = (passwordInput?.value || '');

        console.log('LOGIN PAYLOAD', { email, password });

        if (!email || !password){
          setError('Preencha e-mail e senha.');
          return;
        }

        if (typeof window.kgbAuth !== 'object' || typeof window.kgbAuth.api !== 'function') {
          setError('ERRO: kgbAuth não está disponível.');
          return;
        }

        // Send JSON body via central client; client will stringify and attach token when needed
        let r;
        try {
          r = await window.kgbAuth.api('/auth/login', { method: 'POST', body: { email, password } });
        } catch (err) {
          console.error('[LOGIN] api call failed', err);
          setError((err && err.message) ? err.message : 'Falha ao autenticar');
          return;
        }

        // api() returns { ok, status, data }
        if (!r?.ok || !r?.data || !r.data.ok) {
          const msg = r?.data?.error || r?.data?.message || 'Credenciais inválidas';
          setError(msg);
          console.error('[login] fail', r);
          return;
        }

        // Save token if present
        const token = r.data.token || r.data.jwt || r.data.access_token || r.data.accessToken || (r.data.data && (r.data.data.token || r.data.data.jwt));
        try {
          if (token && window.kgbAuth && typeof window.kgbAuth.setToken === 'function') {
            window.kgbAuth.setToken(token);
          } else if (token) {
            try{ localStorage.setItem('KGB_AUTH_TOKEN', token); }catch(e){}
          }
        } catch (e) {}

        const params = new URLSearchParams(location.search);
        const returnUrl = params.get('returnUrl') || 'dashboard.html';

        try { window.__ALLOW_REDIRECT__ = true; } catch(e){}
        location.replace(returnUrl);

      } catch (err) {
        console.error('[LOGIN] exception', err);
        setError('Falha ao conectar. Abra o Console e veja o erro.');
      } finally {
        setLoading(false);
        try { form.dataset.submitting = '0'; } catch(e){}
      }
    });
  })();
  </script>
</body>
</html>
