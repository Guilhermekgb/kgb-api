<!DOCTYPE html>
<html lang="pt-BR">
<head>
  
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="page-permission" content="page:login.html">
  

  <title>Login - Sistema Buffet</title>

  <script>
    /* Impede bloqueio no login */
    window.__KGB_GUARD_BYPASS__ = true;
  </script>

  <style>
    :root {
      --marrom: #4a2c18;
      --dourado: #f8d57e;
      --dourado-hover: #e0bc66;
      --branco: #ffffff;
      --sombra: rgba(0, 0, 0, 0.1);
      --fonte: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    }

    body {
      background-color: #fdf6ee;
      font-family: var(--fonte);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background-color: var(--branco);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 30px var(--sombra);
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    .login-box img {
      width: 140px;
      margin-bottom: 20px;
    }

    .login-box h2 {
      margin-bottom: 24px;
      color: var(--marrom);
      font-weight: bold;
    }

    .campo {
      text-align: left;
      margin-bottom: 14px;
    }

    .campo label {
      display: block;
      font-size: 12px;
      color: #705542;
      margin: 0 0 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--dourado);
      color: var(--marrom);
      font-weight: bold;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 6px;
    }

    button:hover {
      background-color: var(--dourado-hover);
    }

    .link-esqueci {
      margin-top: 8px;
      text-align: right;
      font-size: 13px;
    }

    .link-esqueci a {
      color: #a16b1f;
      text-decoration: none;
    }

    .link-esqueci a:hover {
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <script>
    // DEBUG + SAFETY: bloquear redirects no login até sucesso explícito
    window.__ALLOW_REDIRECT__ = false;

    (function(){
      const _replace = window.location.replace.bind(window.location);
      const _assign  = window.location.assign.bind(window.location);

      function blocked(target, fnName){
        const t = String(target || '');
        const isDash = t.includes('dashboard.html') || t.endsWith('/dashboard') || t.endsWith('/dashboard.html');
        if (isDash && !window.__ALLOW_REDIRECT__) {
          console.warn('[LOGIN][BLOCK] Tentativa de redirect bloqueada ->', t, 'via', fnName);
          console.trace('[LOGIN][BLOCK] stack trace');
          return; // bloqueia
        }
        return fnName === 'replace' ? _replace(target) : _assign(target);
      }

      window.location.replace = (u) => blocked(u, 'replace');
      window.location.assign  = (u) => blocked(u, 'assign');

      // também bloqueia navegação via link/button com href dashboard
      document.addEventListener('click', (e) => {
        const a = e.target.closest && e.target.closest('a[href]');
        if (!a) return;
        const href = a.getAttribute('href') || '';
        if ((href.includes('dashboard.html') || href.endsWith('dashboard.html')) && !window.__ALLOW_REDIRECT__) {
          e.preventDefault();
          console.warn('[LOGIN][BLOCK] clique em link para dashboard bloqueado:', href);
          console.trace('[LOGIN][BLOCK] click stack');
        }
      }, true);
    })();
  </script>
  <div class="login-box">
    <img src="logo.png" alt="Logo KGB" />
    <h2>Entrar no Sistema</h2>

    <form id="formLogin" autocomplete="on" novalidate>
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seu@email.com" required />
      </div>

      <div class="campo">
        <label for="password">Senha</label>
        <input id="password" type="password" placeholder="Sua senha" required />
      </div>

      <button type="submit">Entrar</button>

      <div class="link-esqueci">
        <span style="font-size:13px; color:#705542;">Esqueceu a senha? Procure o administrador para redefinir.</span>
      </div>
    </form>
    <div id="login-erro" style="color:#a12; margin-top:12px; display:none"></div>
  </div>

  <script type="module" src="./api/api-config.js"></script>
  <script type="module" src="./kgb-common.js"></script>
  <script type="module" src="./api/auth-client.js"></script>

  <script>
    // FORÇA API DO RENDER NO LOGIN (DEV)
    window.__API_BASE__ = 'https://kgb-api-v2.onrender.com';
  </script>
  <script type="module">
  (function(){
    function getVal(selectorList) {
      for (const sel of selectorList) {
        const el = document.querySelector(sel);
        if (el && typeof el.value === 'string') return el.value.trim();
      }
      return "";
    }

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.querySelector('form');
      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = getVal(['#email', "input[name='email']", "input[type='email']"]);
        const senha = getVal(["#senha", '#password', "input[name='senha']", "input[name='password']", "input[type='password']"]);

        console.log('[LOGIN][DIAG] email len=', email.length, ' senha len=', senha.length);

        if (!email || !senha) {
          alert('Preencha e-mail e senha.');
          return;
        }

        const payload = { email, senha };
        console.log('[LOGIN][DIAG] payload =>', payload);

        try {
          // FORÇA API DO RENDER AQUI (apenas no momento do submit desta página)
          window.__API_BASE__ = 'https://kgb-api-v2.onrender.com';

          const login = await window.apiFetch('/auth/login', {
            method: 'POST',
            body: JSON.stringify(payload)
          });

          const token = login.token || login.accessToken;
          if (token) localStorage.setItem('token', token);

          window.location.href = 'dashboard.html';
        } catch (err) {
          console.error('[LOGIN] failed', err);
          alert(err.message || 'Falha no login.');
        }
      });
    });
  })();
  </script>
</body>
</html>
