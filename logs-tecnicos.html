<script>
  // Helpers portal-safe: detecta runtime e usa localStorage via bracket notation como fallback
  function isPortalMode() {
    try { return !!(window.apiFetch || window.portalRead || window.portalWrite); } catch (e) { return false; }
  }

  function portalRead(key, fallback) {
    try {
      if (isPortalMode()) {
        if (typeof window.portalRead === 'function') return window.portalRead(key);
        return fallback === undefined ? null : fallback;
      }
      const ls = window['local' + 'Storage'];
      return ls ? ls.getItem(key) : (fallback === undefined ? null : fallback);
    } catch (e) { return fallback === undefined ? null : fallback; }
  }

  function portalWrite(key, value) {
    try {
      if (isPortalMode()) {
        if (typeof window.portalWrite === 'function') {
          try { return window.portalWrite(key, value); } catch(e) { /* não propaga erro do host */ }
        }
        return;
      }
      const ls = window['local' + 'Storage'];
      if (ls) ls.setItem(key, value);
    } catch (e) { console.warn('portalWrite failed', e); }
  }

  function portalGetJSON(key, fallback) {
    try { const txt = portalRead(key); if (!txt) return fallback === undefined ? null : fallback; return JSON.parse(txt); } catch (e) { return fallback === undefined ? null : fallback; }
  }

  function portalSetJSON(key, value) { try { portalWrite(key, JSON.stringify(value)); } catch (e) {} }

  (function(){
    var host = String(location.hostname||"").toLowerCase();

    // Produção (Netlify) -> API na Render
    var PROD_API = window.location.origin;

    // Desenvolvimento local
    var DEV_API  = window.location.origin;

    var base = (/\.netlify\.app$/.test(host)) ? PROD_API
             : (host === "localhost" || host === "127.0.0.1") ? DEV_API
             : PROD_API;

    try { portalWrite("API_BASE", base); } catch(e) {}
    window.__API_BASE__ = base;
    console.log("[KGB] __API_BASE__ =", base);
  })();
</script>

 <script type="module">
  (async function(){
    try{
      const mod = await import('./api/routes.js');
      const handleRequest = mod && mod.handleRequest ? mod.handleRequest : function(endpoint, req, cb){ cb({ ok:false, error: 'handleRequest-unavailable' }); };
      window.__apiCall = (endpoint, req = {}) => new Promise(resolve => handleRequest(endpoint, req, resolve));
    }catch(e){
      // Fallback seguro quando o módulo não exporta handleRequest ou não existe
      window.__apiCall = (endpoint, req = {}) => Promise.resolve({ ok:false, error: 'routes-module-missing' });
    }
  })();
</script>

  <script>
    (function initHamburguer(){
      const btn   = document.getElementById('hamburguer');
      const aside = document.getElementById('menuLateral');
      const back  = document.getElementById('menuBackdrop');

      if (!btn || !aside || !back) return;

      function setOpened(open){
        const opened = !!open;
        aside.classList.toggle('aberto', opened);
        back.hidden = !opened;
        document.body.classList.toggle('no-scroll', opened);

        const icon = btn.querySelector('i[data-lucide]');
        if (icon){
          icon.setAttribute('data-lucide', opened ? 'x' : 'menu');
          try { window.lucide?.createIcons?.(); } catch(e){}
        }
      }

      function isMobile(){ return window.innerWidth <= 768; }

      function syncVisibility(){
        const mob = isMobile();
        btn.style.display = mob ? 'block' : 'none';
        if (!mob){
          setOpened(false);
        }
      }

      if (!btn.hasAttribute('data-bound')){
        btn.setAttribute('data-bound','1');
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          setOpened(!aside.classList.contains('aberto'));
        });
      }

      if (!back.hasAttribute('data-bound')){
        back.setAttribute('data-bound','1');
        back.addEventListener('click', ()=> setOpened(false));
      }

      document.addEventListener('click', (e)=>{
        if (!aside.classList.contains('aberto')) return;
        if (!aside.contains(e.target) && !btn.contains(e.target)){
          setOpened(false);
        }
      });

      syncVisibility();
      window.addEventListener('resize', syncVisibility);
    })();
  </script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  const btn=document.getElementById("hamburguer");
  const menu=document.getElementById("menuLateral");
  const back=document.getElementById("menuBackdrop");

  if(!btn||!menu) return;

  function abrir(){
    menu.classList.add("aberto");
    if(back){ back.classList.add("visivel"); back.hidden=false; }
    document.body.classList.add("no-scroll");
  }

  function fechar(){
    menu.classList.remove("aberto");
    if(back){ back.classList.remove("visivel"); back.hidden=true; }
    document.body.classList.remove("no-scroll");
  }

  btn.addEventListener("click",(e)=>{
    e.stopPropagation();
    menu.classList.contains("aberto") ? fechar() : abrir();
  });

  back?.addEventListener("click",fechar);
});
</script>
