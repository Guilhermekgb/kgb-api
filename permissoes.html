  <!-- Helpers globais SEMPRE antes do guard -->

<script type="module" src="./kgb-common.js"></script>

<!-- Phase 1: memStore + sync + api wrappers -->
<script>
  (function(){
    if (typeof window !== 'undefined') window.__MEM_CACHE__ = window.__MEM_CACHE__ || {};
    const mem = (typeof window !== 'undefined') ? window.__MEM_CACHE__ : {};

    let bc = null;
    if (typeof window !== 'undefined' && 'BroadcastChannel' in window) {
      try { bc = new BroadcastChannel('kgb-ui-sync'); } catch(e) { bc = null; }
    }

    function sendSync(k,v){ try{ if (bc) bc.postMessage({k,v}); else window.dispatchEvent(new CustomEvent('kgb-ui-sync',{detail:{k,v}})); }catch{} }
    function onSync(fn){ if (bc) bc.addEventListener('message', e=>fn(e.data)); else window.addEventListener('kgb-ui-sync', e=>fn(e.detail)); }
    function getJSON(k, fallback){ try{ const val = mem[k]; return val===undefined ? (typeof fallback==='function'?fallback():fallback) : val; }catch{ return typeof fallback==='function'?fallback():fallback; } }
    function setJSON(k,v){ try{ mem[k]=v; sendSync(k,v); }catch{} }
    function isPortalMode(){ try{ return !!(window && window.__PORTAL_MODE__===true); }catch{return false;} }
    function apiFetchWrapper(p,opts){ return (window && window.apiFetch) ? window.apiFetch(p,opts) : null; }

    // expose helpers to page scripts
    try{ window.getJSON = window.getJSON || getJSON; window.setJSON = window.setJSON || setJSON; window.isPortalMode = window.isPortalMode || isPortalMode; window.apiFetchWrapper = window.apiFetchWrapper || apiFetchWrapper; }catch{}
  })();
</script>

<!-- Guard (module) e auth-client -->
<script type="module" src="./api/auth-client.js"></script>
<script type="module" src="./api/proteger-pagina.js"></script>

<!-- Helpers portal-safe locais -->
<script>
  (function(){
    function _isPortal(){ try{ return !!(window && window.isPortalMode && window.isPortalMode()); }catch{return false;} }

    function portalRead(key, fallback){ try{
      if (_isPortal()){
        try{ return (window.getJSON ? window.getJSON(key, fallback) : (window.__MEM_CACHE__?window.__MEM_CACHE__[key]:fallback)); }catch{ return fallback; }
      }
      const ls = window['local'+'Storage'];
      const v = ls && ls.getItem(key);
      return v===null||v===undefined ? (typeof fallback==='function'?fallback():fallback) : v;
    }catch{ return typeof fallback==='function'?fallback():fallback; } }

    function portalWrite(key, value){ try{
      if (_isPortal()){
        try{ if (window.setJSON) { window.setJSON(key, value); return; } if (window.__MEM_CACHE__){ window.__MEM_CACHE__[key]=value; return; } }catch{}
        return;
      }
      const ls = window['local'+'Storage']; if (ls) ls.setItem(key, String(value));
    }catch{} }

    function portalRemove(key){ try{
      if (_isPortal()){
        try{ if (window.setJSON){ window.setJSON(key, undefined); } if (window.__MEM_CACHE__){ delete window.__MEM_CACHE__[key]; } return; }catch{}
        return;
      }
      const ls = window['local'+'Storage']; if (ls) ls.removeItem(key);
    }catch{} }

    try{ window.portalRead = window.portalRead || portalRead; window.portalWrite = window.portalWrite || portalWrite; window.portalRemove = window.portalRemove || portalRemove; }catch{}
  })();
</script>

  <title>Permissões Detalhadas por Perfil</title>
  <link rel="stylesheet" href="menu-lateral.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Playfair Display', serif;
      background-color: #f8f1e8;
      height: 100%;
      overflow-x: hidden;
    }
    body { display: flex; flex-direction: column; }
    .wrapper { display: flex; flex-grow: 1; height: 100%; overflow: hidden; }
    #menuLateral { flex-shrink: 0; width: 260px; min-height: 100vh; background-color: #5C4033; }
    main { flex-grow: 1; padding: 40px; padding-left: 300px; box-sizing: border-box; height: 100vh; overflow-y: auto; max-width: 100%; }

    h1 {
      color: #5a3e2b; font-size: 26px; border-bottom: 2px solid #c29a5d;
      padding-bottom: 10px; display: flex; align-items: center; gap: 10px;
    }
    h2 { color: #5a3e2b; margin-top: 30px; font-size: 20px; }
    table {
      width: 100%; border-collapse: collapse; background-color: white; border-radius: 12px;
      overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-top: 10px;
    }
    th, td { padding: 10px; text-align: center; font-size: 14px; border-bottom: 1px solid #f1e3d3; }
    th { background-color: #f3e4c5; color: #5a3300; }
    tr:nth-child(even) { background-color: #fdf7ed; }
    button {
      margin-top: 20px; background-color: #c29a5d; color: white; border: none;
      padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
    button:hover { background-color: #a57d3a; }

    #hamburguer {
      position: fixed; top: 12px; left: 12px; background: #c29a5d; border: none;
      color: white; font-size: 24px; padding: 6px 12px; border-radius: 8px; z-index: 1001; display: none;
    }
    /* Fundo escuro por trás do menu */
#menuBackdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 998;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
}
#menuBackdrop.visivel{
  opacity:1;
  pointer-events:auto;
}

/* Quando o menu está aberto, trava o scroll do fundo */
body.no-scroll{
  overflow:hidden;
}

@media (max-width: 768px) {
  main {
    padding: 20px;
    padding-left: 0;
  }

  #hamburguer {
    display: block;
  }

  .wrapper {
    flex-direction: column;
  }

  #menuLateral {
    position: fixed;
    top: 0;
    left: 0;
    width: 240px;
    height: 100vh;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 999;
  }

  /* Quando aberto, entra deslizando da esquerda */
  #menuLateral.aberto {
    transform: translateX(0);
  }
}

    
  </style>
</head>

<body>
  <button id="hamburguer"><i data-lucide="menu"></i></button>

  <div class="wrapper">
    <aside id="menuLateral"></aside>
    <div id="menuBackdrop" hidden></div>


    <main>
      <h1><i data-lucide="settings"></i> Permissões por Perfil</h1>

      <!-- ===== Permissões de UI (já existentes) ===== -->
      <div id="tabelasPermissoes"></div>
      <button id="btnSalvarPermissoes">Salvar Permissões</button>

      <h2 style="margin-top: 40px;">Resumo por Perfil</h2>
      <div id="resumo-perfis"></div>

      
    </main>
  </div>

  <!-- Menu + guard -->
  <script type="module" src="menu-lateral.js"></script>
      

  <!-- Permissões da UI (bootstrap após guard) -->
  <script type="module">
    (async () => {
      try {
        const meta = document.querySelector('meta[name="page-permission"]');
        const permissao = meta?.content?.trim();

        if (typeof window.guard === 'function') {
          await window.guard(permissao ? { permissao } : undefined);
        }

        // garantir persistência do API_BASE no dev (após api-config já ter setado)
        const host = String(location.hostname || '').toLowerCase();
        if (host === 'localhost' || host === '127.0.0.1') {
          const RENDER = 'https://kgb-api-v2.onrender.com';
          window.__API_BASE__ = localStorage.getItem('API_BASE') || RENDER;
          try { localStorage.setItem('API_BASE', window.__API_BASE__); } catch (e) {}
          console.log('[KGB] permissoes forced API_BASE ->', window.__API_BASE__);
        }

        // agora carrega a lógica de permissoes
        await import('./permissoes.js');
      } catch (e) {
        console.error('[permissoes] bootstrap falhou:', e);
      }
    })();
  </script>
  <!-- Controle do menu mobile (hambúrguer) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btn      = document.getElementById('hamburguer');
      const menu     = document.getElementById('menuLateral');
      const backdrop = document.getElementById('menuBackdrop');

      if (!btn || !menu) {
        console.warn('[permissoes] Botão ou menu não encontrados');
        return;
      }

      function fecharMenu(){
        menu.classList.remove('aberto');
        btn.setAttribute('aria-expanded','false');
        if (backdrop){
          backdrop.classList.remove('visivel');
          backdrop.hidden = true;
        }
        document.body.classList.remove('no-scroll');
      }

      function toggleMenu(ev){
        if (ev) ev.stopPropagation();
        const aberto = menu.classList.toggle('aberto');
        btn.setAttribute('aria-expanded', aberto ? 'true' : 'false');

        if (backdrop){
          backdrop.hidden = !aberto;
          backdrop.classList.toggle('visivel', aberto);
        }

        document.body.classList.toggle('no-scroll', aberto);
      }

      // Clicar no hambúrguer ABRE/FECHA o menu
      btn.addEventListener('click', toggleMenu);

      // Clicar no fundo escuro fecha
      backdrop?.addEventListener('click', fecharMenu);

      // Clicar fora do menu fecha (no mobile)
      document.addEventListener('click', (e) => {
        if (!menu.classList.contains('aberto')) return;
        if (!menu.contains(e.target) && !btn.contains(e.target)) {
          fecharMenu();
        }
      });

      // Ao trocar pra tela grande, garante tudo fechado
      window.addEventListener('resize', () => {
        if (window.innerWidth > 768) {
          fecharMenu();
        }
      });
    });
  </script>


  
   

  <!-- legacy includes removed: auth-helper and api-fetch are not loaded here to avoid overrides -->
</body>
</html>
